name: Weekly Top 5 Movies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        type: choice
        options:
          - landscape
          - portrait
        default: landscape

concurrency:
  group: weekly-top5
  cancel-in-progress: false

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate weekly data
        run: npm run generate

      - name: Render video (landscape)
        if: ${{ github.event_name == 'schedule' || inputs.format == 'landscape' }}
        run: npm run render -- --format landscape

      - name: Render video (portrait)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.format == 'portrait' }}
        run: npm run render -- --format portrait

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: top5-weekly-${{ github.run_id }}
          path: out/**/
          if-no-files-found: error
