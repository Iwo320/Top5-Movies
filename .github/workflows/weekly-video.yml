name: Weekly Top 5 video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run generate

      - name: Install free local TTS
        run: |
          python3 -m pip install --upgrade piper-tts
          python3 -m piper.download_voices pl_PL-gosia-medium --download-dir "$HOME/.local/share/piper"

      - name: Generate Polish voiceovers
        env:
          PIPER_MODEL: "$HOME/.local/share/piper/pl_PL-gosia-medium.onnx"
        run: npm run generate:voiceovers

      - name: Render video
        env:
          FORMAT: landscape
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: top5-weekly-video
          path: out/*/top5-weekly-landscape.mp4
          retention-days: 30
